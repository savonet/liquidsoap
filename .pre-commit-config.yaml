---
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
#
# Run the following command to set up the pre-commit git hook scripts:
# $ pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-symlinks
      - id: destroyed-symlinks

      - id: check-json
      - id: check-yaml
      - id: check-xml

      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: (dune.inc|fixtures/)
      - id: mixed-line-ending
        exclude: (dune.inc|fixtures/)
      - id: trailing-whitespace
        exclude: (dune.inc|fixtures/)

  - repo: https://github.com/savonet/pre-commit-liquidsoap
    rev: f1f288ad551c8b4c01d1943c7b55854ad77ba9b5
    hooks:
      - id: liquidsoap-prettier
      - id: prettier
        # Parser test fixture: prettier would normalize away the syntax it covers.
        exclude: ^src/modules/synced/miniyaml/test/test\.yaml$

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args: [-w, --ignore-words=.codespellignore]
        exclude: ^(doc/orig/fosdem2020|tests/language/cue_test.liq)

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.7
    hooks:
      - id: clang-format
        types_or: [c, c++]

  - repo: local
    hooks:
      - id: release-table
        name: release-table
        language: node
        entry: .github/scripts/gen-release-table.sh
        additional_dependencies: ["prettier@3.6.0"]
        pass_filenames: false
        files: ^(\.github/release-matrix\.json|\.github/scripts/gen-release-table\.sh|README\.md)$

      - id: shfmt
        name: shfmt
        language: docker_image
        entry: mvdan/shfmt -i 2 -ci -sr -kp -w
        types: [shell]

      - id: shellcheck
        name: shellcheck
        language: docker_image
        entry: koalaman/shellcheck --color=always
        types: [shell]

      - id: mutexed-lazy
        name: mutexed-lazy
        language: system
        entry: .github/scripts/check-mutexed-lazy.sh
        files: ^src/(core|lang|js|bin)/.*\.mli?$

      - id: dunefmt
        name: dunefmt
        language: system
        entry: opam exec dune -- build @fmt --auto-promote
        files: \.(ml|mli|dune|dune-project)$
        pass_filenames: false

      - id: dunegen
        name: dunegen
        language: system
        entry: opam exec dune -- build @gendune --auto-promote
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
