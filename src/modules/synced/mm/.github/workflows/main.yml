name: CI

on: [push]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        ocaml-compiler: ["5.3"]
        include:
          - os: macos-latest
            extra-packages: ao mad pulseaudio theora
          - os: ubuntu-latest
            extra-packages: alsa ao mad pulseaudio theora
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ocaml/setup-ocaml@e89b2ded52a6e13f50162220cf5fe47290162032 # v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
      - run: opam pin add -n .
      - run: opam install ${{ matrix.extra-packages }}
      - run: opam depext -yt mm
      - run: opam install -t .
