name: Tests

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      branch:
        required: true
        type: string
      is_fork:
        required: true
        type: string
      save_traces:
        required: true
        type: string
    secrets:
      LIQUIDSOAP_TEST_REPO_TOKEN:
        required: false

jobs:
  run_tests:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/savonet/liquidsoap:ci-v2-debian_trixie-5.5.0@sha256:b33103ca76ca91986e3b4476d03131f0ce6523a74858caa0d8b3298ec841bd02
      options: --user root --privileged --ulimit core=-1 --security-opt seccomp=unconfined -v ${{ github.workspace }}/${{ github.run_number }}:/tmp/${{ github.run_number }}
    strategy:
      fail-fast: false
      matrix:
        target: ["@citest", "@doctest", "@mediatest"]
    env:
      HOME: /home/opam
    steps:
      - name: Checkout code
        run: |
          sudo -u opam git clone --depth 1 https://github.com/savonet/liquidsoap.git /tmp/liquidsoap
          cd /tmp/liquidsoap
          sudo -u opam git fetch --depth 1 origin ${{ inputs.sha }}
          sudo -u opam git checkout ${{ inputs.sha }}
      - name: Restore test fixture cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.HOME }}/.cache/liquidsoap-test-fixtures
          key: test-fixtures-${{ matrix.target }}-
          restore-keys: test-fixtures-${{ matrix.target }}-
      - name: Make test fixture cache writable
        run: |
          mkdir -p ${{ env.HOME }}/.cache/liquidsoap-test-fixtures
          chown -R opam ${{ env.HOME }}/.cache/liquidsoap-test-fixtures
      - name: Get number of CPU cores
        uses: savonet/github-actions-cpu-cores-docker@c8384053077d8c21cca9333c6388485fc7b136e1 # v1
        id: cpu_cores
      - name: Enable core dump
        run: |
          ulimit -c unlimited
          mkdir -p /tmp/${{ github.run_number }}/core
          chown -R opam /tmp/${{ github.run_number }}/core
          echo /tmp/${{ github.run_number }}/core/core.%h.%e.%t > /proc/sys/kernel/core_pattern
      - name: Build
        env:
          CPU_CORES: ${{ steps.cpu_cores.outputs.count }}
          GITHUB_SHA: ${{ inputs.sha }}
        run: |
          sudo -u opam -E /tmp/liquidsoap/.github/scripts/build-posix.sh "${{ steps.cpu_cores.outputs.count }}"
          cp /tmp/liquidsoap/_build/default/src/bin/liquidsoap.exe /tmp/${{ github.run_number }}/core/liquidsoap
      - name: Install additional packages for @doc
        if: matrix.target == '@doctest'
        run: |
          apt-get -y update
          apt-get -y install frei0r-plugins
          sudo -u opam -E opam install odoc
      - name: Install additional packages for @citest
        if: matrix.target == '@citest'
        run: |
          apt-get -y update
          apt-get -y install gnuplot
      - name: Run tests
        env:
          CPU_CORES: ${{ steps.cpu_cores.outputs.count }}
          LIQUIDSOAP_TEST_REPO_TOKEN: ${{ secrets.LIQUIDSOAP_TEST_REPO_TOKEN }}
        run: |
          cd /tmp/liquidsoap
          sudo -u opam -E ./.github/scripts/test-posix.sh ${{ matrix.target }}
      # The stamp files name what the cache holds, so a run that downloaded
      # nothing new keeps the existing key and skips the upload.
      - name: Compute test fixture cache key
        if: success() || failure()
        id: fixtures
        run: |
          echo "key=test-fixtures-${{ matrix.target }}-$(cat ${{ env.HOME }}/.cache/liquidsoap-test-fixtures/*.url 2>/dev/null | sha256sum | cut -d' ' -f1)" >> $GITHUB_OUTPUT
      - name: Save test fixture cache
        if: success() || failure()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.HOME }}/.cache/liquidsoap-test-fixtures
          key: ${{ steps.fixtures.outputs.key }}
      - name: Finalize metrics
        run: |
          cd /tmp/liquidsoap
          mkdir -p "/tmp/${{ github.run_number }}/metrics"
          chown -R opam "/tmp/${{ github.run_number }}/metrics"
          sudo -u opam -E ./.github/scripts/export-metrics.sh "${{ inputs.branch }}" "/tmp/${{ github.run_number }}/metrics"
      - name: Upload metrics artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.is_fork != 'true' && matrix.target == '@citest'
        with:
          name: metrics
          path: ${{ github.workspace }}/${{ github.run_number }}/metrics
      - name: Upload metrics
        if: inputs.is_fork != 'true' && matrix.target == '@citest'
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: metrics
          publish_dir: ${{ github.workspace }}/${{ github.run_number }}/metrics
          keep_files: true
      - name: Save traces
        if: (success() || failure()) && inputs.save_traces == 'true'
        run: |
          mkdir -p /tmp/${{ github.run_number }}/traces/${{ matrix.target }}
          cd /tmp/liquidsoap
          find _build/default/tests | grep '\.trace$' | while read i; do mv "$i" /tmp/${{ github.run_number }}/traces/${{ matrix.target }}; done
      - name: Upload traces
        if: (success() || failure()) && inputs.save_traces == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: traces-${{ matrix.target }}
          path: ${{ github.workspace }}/${{ github.run_number }}/traces/${{ matrix.target }}
      - name: Prepare test artifacts
        if: (success() || failure()) && matrix.target == '@citest'
        run: |
          mkdir -p /tmp/${{ github.run_number }}/test-artifacts/tests/streams
          mkdir -p /tmp/${{ github.run_number }}/test-artifacts/tests/regression
          cd /tmp/liquidsoap
          for f in _build/default/tests/streams/*.gen; do
            cp -f "$f" "/tmp/${{ github.run_number }}/test-artifacts/tests/streams/$(basename "${f%.gen}")"
          done
          cp -f _build/default/tests/regression/GH5019.gen.png /tmp/${{ github.run_number }}/test-artifacts/tests/regression/GH5019.png || true
      - name: Upload test artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: (success() || failure()) && inputs.is_fork != 'true' && matrix.target == '@citest'
        with:
          name: test-artifacts
          path: ${{ github.workspace }}/${{ github.run_number }}/test-artifacts
      - name: Export potential core dumps
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: core-dump-${{ matrix.target }}
          path: ${{ github.workspace }}/${{ github.run_number }}/core
      - name: Cleanup
        if: ${{ always() }}
        run: |
          rm -rf /tmp/${{ github.run_number }}/core
