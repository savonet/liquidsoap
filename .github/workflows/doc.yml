name: Documentation

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      branch:
        required: true
        type: string
      publish:
        description: Push the built site. Off for pull requests, which build it as a check.
        required: false
        default: false
        type: boolean
    secrets:
      WEBSITE_TOKEN:
        required: false

jobs:
  update_doc:
    runs-on: depot-ubuntu-24.04-4
    container:
      image: ghcr.io/savonet/liquidsoap:ci-v2-debian_trixie-5.4.0@sha256:1521b53591f846a76affe11cddc69402de41936523339c3fafa8c248fa396f5d
      options: --user root -v ${{ github.workspace }}/${{ github.run_number }}:/tmp/${{ github.run_number }}
    env:
      HOME: /home/opam
    steps:
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Get number of CPU cores
        uses: savonet/github-actions-cpu-cores-docker@c8384053077d8c21cca9333c6388485fc7b136e1 # v1
        id: cpu_cores
      - name: Download JS artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: liquidsoap-js-${{ inputs.branch }}
          path: /tmp/${{ github.run_number }}/js-artifacts
      - name: Checkout code
        run: |
          sudo -u opam git clone --depth 1 https://github.com/savonet/liquidsoap.git /tmp/liquidsoap
          cd /tmp/liquidsoap
          sudo -u opam git fetch --depth 1 origin ${{ inputs.sha }}
          sudo -u opam git checkout ${{ inputs.sha }}
      - name: Build doc
        env:
          CPU_CORES: ${{ steps.cpu_cores.outputs.count }}
        run: |
          cd /tmp/liquidsoap
          sudo -u opam -E ./.github/scripts/build-posix.sh "${{ steps.cpu_cores.outputs.count }}"
          sudo -u opam -E ./.github/scripts/build-doc.sh
          mkdir -p /tmp/${{ github.run_number }}/odoc
          cp -rf _build/default/_doc/_html/* /tmp/${{ github.run_number }}/odoc
          # Copy JS artifacts after build to avoid dune overwriting them
          mkdir -p _build/default/src/js
          cp -f /tmp/${{ github.run_number }}/js-artifacts/* _build/default/src/js/
      - name: Build the website
        run: |
          set -eu
          git clone --depth 1 https://github.com/savonet/website.git /tmp/website

          # The in-development version comes straight out of the build above: doc/content
          # for the prose, _build/default/doc for the five files only the binary can
          # produce, and dune-project for the version the site labels it with.
          BUNDLE=/tmp/doc-bundle
          mkdir -p "$BUNDLE"
          cp -R /tmp/liquidsoap/doc/content "$BUNDLE/content"
          for f in reference reference-extras reference-deprecated protocols settings; do
            cp "/tmp/liquidsoap/_build/default/doc/$f.md" "$BUNDLE/$f.md"
          done
          sed -n 's/^(version \(.*\))$/\1/p' /tmp/liquidsoap/dune-project > "$BUNDLE/version"

          cd /tmp/website
          npm ci
          node scripts/sync-docs.mjs --version dev --bundle "$BUNDLE"
          npm run build

          # /try is a page of the site, emitted as try.html; only the interpreter and the
          # editor bundle come from js.yml, into the directory the page loads them from.
          # The artifact's own index.html is the local dev harness, and is not copied.
          mkdir -p build/try
          cp -f /tmp/${{ github.run_number }}/js-artifacts/interactive_js.bc.js \
                /tmp/${{ github.run_number }}/js-artifacts/playground.bundle.js \
                build/try/

          mkdir -p /tmp/${{ github.run_number }}/html
          cp -rf build/* /tmp/${{ github.run_number }}/html
      - name: Push doc content
        if: success() && inputs.publish && github.repository_owner == 'savonet'
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          repo: savonet/savonet.github.io
          target_branch: master
          build_dir: ${{ github.run_number }}/html
          fqdn: www.liquidsoap.info
        env:
          GH_PAT: ${{ secrets.WEBSITE_TOKEN }}
      - name: Push odoc content
        if: success() && inputs.publish && github.repository_owner == 'savonet'
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          repo: savonet/liquidsoap
          target_branch: gh_pages
          build_dir: ${{ github.run_number }}/odoc
        env:
          GH_PAT: ${{ secrets.WEBSITE_TOKEN }}
