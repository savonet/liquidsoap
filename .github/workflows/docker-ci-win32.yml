name: Build Windows Cross-Compilation CI Image

on:
  workflow_dispatch:
    inputs:
      ocaml_versions:
        description: "OCaml versions (JSON array), defaults to .github/ocaml-version"
        required: false
        type: string
      no_cache:
        description: "Disable Docker layer cache"
        required: false
        default: false
        type: boolean
      push:
        description: "Push image to registry"
        required: false
        default: true
        type: boolean

jobs:
  ocaml_version:
    uses: ./.github/workflows/ocaml-version.yml

  build-win32-ci:
    needs: ocaml_version
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        ocaml_version: ${{ fromJSON(inputs.ocaml_versions || needs.ocaml_version.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          build-args: |
            OCAML_VERSION=${{ matrix.ocaml_version }}
          context: .
          file: .github/docker/win32-base.dockerfile
          platforms: linux/amd64
          tags: ghcr.io/savonet/liquidsoap:ci-v2-win32-x64-${{ matrix.ocaml_version }}
          push: ${{ inputs.push }}
          no-cache: ${{ inputs.no_cache }}
          provenance: false
          sbom: false
