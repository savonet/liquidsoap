name: Build ASAN

on:
  workflow_dispatch:
    inputs:
      ocaml_version:
        description: "OCaml version"
        required: false
        default: "5.5.1"
        type: string
  workflow_call:
    inputs:
      ocaml_version:
        required: false
        default: "5.5.1"
        type: string
      is_rolling_release:
        required: false
        type: string
      is_release:
        required: false
        type: string
      build_stamp:
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/savonet/liquidsoap:ci-asan-${{ inputs.ocaml_version || '5.5.1' }}
      options: --user root --privileged -v ${{ github.workspace }}/${{ github.run_number }}:/tmp/artifacts
    env:
      HOME: /home/opam
      LIQUIDSOAP_INSTALL_NO_OPTIONAL_FAIL: "true"
      OCAML_VERSION: ${{ inputs.ocaml_version || '5.5.1' }}
      BRANCH: ${{ github.head_ref || github.ref_name }}
      ASAN_OPTIONS: "detect_leaks=0:detect_stack_use_after_return=0:detect_container_overflow=0:protect_shadow_gap=0:verify_asan_link_order=0"
      SKIP_SDL: "true"
    outputs:
      basename: ${{ steps.build_deb.outputs.basename }}
    steps:
      - name: Checkout code
        run: |
          sudo -u opam git clone --depth 1 https://github.com/savonet/liquidsoap.git /tmp/liquidsoap
          cd /tmp/liquidsoap
          sudo -u opam git fetch --depth 1 origin ${{ github.sha }}
          sudo -u opam git checkout ${{ github.sha }}
      - name: Get number of CPU cores
        uses: savonet/github-actions-cpu-cores-docker@c8384053077d8c21cca9333c6388485fc7b136e1 # v1
        id: cpu_cores
      - name: Build
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          sudo -u opam -E /tmp/liquidsoap/.github/scripts/build-posix.sh "${{ steps.cpu_cores.outputs.count }}"
      - name: Build debian package
        id: build_deb
        env:
          GITHUB_SHA: ${{ github.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          IS_ROLLING_RELEASE: ${{ inputs.is_rolling_release }}
          IS_RELEASE: ${{ inputs.is_release }}
          BUILD_STAMP: ${{ inputs.build_stamp }}
          PACKAGE_SUFFIX: -asan
          LIQ_TMP_DIR: /tmp/artifacts
          PLATFORM: amd64
          DEB_RELEASE: "1"
          SKIP_MINIMAL: "true"
        # The codename, not "testing", is what build-repo.sh files the package
        # under, and it is only known inside the image.
        run: |
          . /etc/os-release
          export DOCKER_TAG="debian-${VERSION_CODENAME}-ocaml${OCAML_VERSION}-asan"
          mkdir -p /tmp/artifacts
          chown opam /tmp/artifacts
          chown opam "${GITHUB_OUTPUT}"
          sudo -u opam -E /tmp/liquidsoap/.github/scripts/build-deb.sh
      - name: Upload debian package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.build_deb.outputs.basename }}
          path: ${{ github.workspace }}/${{ github.run_number }}/*.deb
          if-no-files-found: error

  docker:
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download debian package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.basename }}
          path: /tmp/deb
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          build-args: |
            DEB_FILE=${{ needs.build.outputs.basename }}.deb
          context: /tmp/deb
          file: .github/docker/debian-asan-release.dockerfile
          platforms: linux/amd64
          tags: ghcr.io/savonet/liquidsoap:asan-${{ github.sha }}
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          sbom: false
