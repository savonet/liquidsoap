name: Build CI ASAN Docker Images

on:
  workflow_dispatch:
    inputs:
      ocaml_versions:
        description: "OCaml versions (JSON array)"
        required: false
        default: '["5.5.1"]'
        type: string
      push:
        description: "Push images to registry"
        required: false
        default: true
        type: boolean
      no_cache:
        description: "Disable Docker layer cache"
        required: false
        default: true
        type: boolean

jobs:
  build-asan:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        ocaml_version: ${{ fromJSON(inputs.ocaml_versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          build-args: |
            OCAML_VERSION=${{ matrix.ocaml_version }}
            LIQUIDSOAP_SHA=${{ github.sha }}
          context: .
          file: .github/docker/debian-asan.dockerfile
          platforms: linux/amd64
          tags: ghcr.io/savonet/liquidsoap:ci-asan-${{ matrix.ocaml_version }}
          push: ${{ inputs.push }}
          no-cache: ${{ inputs.no_cache }}
          provenance: false
          sbom: false
