name: Synced mirror PR

# No `paths` filter: a rebase that drops the synced changes must still run, so
# that the mirror it left behind gets closed.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mirror-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mirror changed modules as PRs
        env:
          GH_TOKEN: ${{ secrets.SUBTREE_PUSH_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_ACTION: ${{ github.event.action }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          branch="mirror/pr-${PR_NUMBER}"

          if [ "$PR_ACTION" = "closed" ]; then
            if [ "$PR_MERGED" = "true" ]; then
              reason="Merged in savonet/liquidsoap#${PR_NUMBER}."
            else
              reason="savonet/liquidsoap#${PR_NUMBER} was closed."
            fi
          else
            reason="savonet/liquidsoap#${PR_NUMBER} no longer changes this module."
          fi

          for dir in src/modules/synced/*/; do
            name=$(basename "$dir")

            if [ "$PR_ACTION" = "closed" ] ||
               git diff --quiet "origin/${BASE_REF}" HEAD -- "src/modules/synced/$name/"; then
              .github/scripts/drop-mirror.sh "$name" "$branch" "$reason"
              continue
            fi

            upstream="https://x-access-token:${GH_TOKEN}@github.com/savonet/ocaml-$name"
            git clone "$upstream" /tmp/synced-$name
            cd /tmp/synced-$name
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -b "$branch"
            rsync -a --delete --exclude='.git' "$GITHUB_WORKSPACE/src/modules/synced/$name/" .
            git add -A
            if git diff --cached --quiet; then
              cd -
              continue
            fi
            git commit -m "Mirror of savonet/liquidsoap#${PR_NUMBER}: ${PR_TITLE}"
            git push origin "$branch" --force
            cd -

            default_branch=$(gh repo view "savonet/ocaml-$name" --json defaultBranchRef --jq '.defaultBranchRef.name')
            if ! gh pr list --repo "savonet/ocaml-$name" --head "$branch" --json number --jq 'length > 0' | grep -q true; then
              printf 'Mirror of savonet/liquidsoap#%s\n\n%s' "$PR_NUMBER" "$PR_BODY" > /tmp/pr-body.md
              gh pr create \
                --repo "savonet/ocaml-$name" \
                --head "$branch" \
                --base "$default_branch" \
                --title "$PR_TITLE" \
                --body-file /tmp/pr-body.md
            fi
          done
